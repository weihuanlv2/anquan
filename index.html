<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>兴达安全数据看板</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #07111f;
      color: #f4f8fc;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #07111f;
    }
    main {
      width: min(100%, 560px);
      padding: 48px 52px;
      text-align: center;
      background: #0d1c2d;
      border: 1px solid #29435c;
      border-radius: 16px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .32);
    }
    .mark {
      width: 56px;
      height: 56px;
      margin: 0 auto 24px;
      transform: rotate(45deg);
      border: 12px solid #ef3340;
      border-left-color: transparent;
    }
    h1 { margin: 0; font-size: clamp(28px, 5vw, 40px); line-height: 1.2; }
    .rule { height: 1px; margin: 34px 0; background: #29435c; }
    .spinner {
      width: 42px;
      height: 42px;
      margin: 0 auto 18px;
      border: 4px solid #29435c;
      border-top-color: #26b8f4;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    #status { margin: 0 0 22px; color: #dbe7f2; font-size: 19px; font-weight: 650; }
    .progress { height: 6px; overflow: hidden; background: #29435c; border-radius: 99px; }
    .progress::before {
      content: "";
      display: block;
      width: 35%;
      height: 100%;
      background: #26b8f4;
      border-radius: inherit;
      animation: move 1.2s ease-in-out infinite alternate;
    }
    a {
      display: block;
      margin-top: 28px;
      padding: 15px 20px;
      color: #40c2fa;
      font-size: 18px;
      font-weight: 700;
      text-decoration: none;
      border: 2px solid #26b8f4;
      border-radius: 9px;
    }
    a:hover, a:focus-visible { color: #07111f; background: #40c2fa; outline: none; }
    .error .spinner { border: 4px solid #ef3340; animation: none; }
    .error #status { color: #ff7d86; }
    .error .progress { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes move { to { transform: translateX(185%); } }
    @media (prefers-reduced-motion: reduce) { .spinner, .progress::before { animation: none; } }
    @media (max-width: 560px) {
      body { padding: 16px; }
      main { padding: 38px 24px; }
      .rule { margin: 28px 0; }
    }
  </style>
</head>
<body>
  <main id="panel">
    <div class="mark" aria-hidden="true"></div>
    <h1>兴达安全数据看板</h1>
    <div class="rule"></div>
    <div class="spinner" aria-hidden="true"></div>
    <p id="status" role="status">正在连接安全数据看板</p>
    <div class="progress" aria-hidden="true"></div>
    <a id="enter" href="#" hidden>立即进入</a>
  </main>
  <script>
    const panel = document.getElementById('panel');
    const status = document.getElementById('status');
    const enter = document.getElementById('enter');

    fetch('./target.json?t=' + Date.now(), { cache: 'no-store' })
      .then(response => {
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return response.json();
      })
      .then(data => {
        if (!/^https:\/\/[-a-z0-9]+\.trycloudflare\.com\/?$/.test(data.url || '')) {
          throw new Error('invalid target');
        }
        enter.href = data.url;
        enter.hidden = false;
        status.textContent = '连接成功，正在进入看板';
        window.setTimeout(() => window.location.replace(data.url), 700);
      })
      .catch(() => {
        panel.classList.add('error');
        status.textContent = '暂时无法连接，请稍后重试';
        enter.href = window.location.href;
        enter.textContent = '重新尝试';
        enter.hidden = false;
      });
  </script>
</body>
</html>
